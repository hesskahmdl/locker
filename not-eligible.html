<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Méthode non éligible | Epic Games</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-page: #121117;
    --bg-modal: #18181c;
    --border-color: rgba(255, 255, 255, 0.1);
    --text-main: #ffffff;
    --text-muted: rgba(255, 255, 255, 0.65);
    --blue-primary: #26bbff;
    --blue-hover: #50dcff;
    --amber: #fbbf24;
    --amber-bg: rgba(251, 191, 36, 0.12);
    --font-main: 'Inter', Arial, sans-serif;
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: var(--font-main);
  }

  body {
    min-height: 100vh;
    background: var(--bg-page);
    display: flex;
    justify-content: center;
    align-items: center;
    color: var(--text-main);
    padding: 30px;
    -webkit-font-smoothing: antialiased;
  }

  .modal {
    width: 100%;
    max-width: 560px;
    background: var(--bg-modal);
    border-radius: 22px;
    padding: 40px 46px 46px;
    border: 1px solid var(--border-color);
    box-shadow: 0 24px 80px rgba(0, 0, 0, 0.5);
    text-align: center;
  }

  /* ====== ICÔNE D'AVERTISSEMENT ====== */
  .warning-icon {
    width: 64px;
    height: 64px;
    margin: 0 auto 24px;
    background: var(--amber-bg);
    border-radius: 50%;
    display: grid;
    place-items: center;
    position: relative;
  }

  .warning-icon svg {
    width: 32px;
    height: 32px;
    color: var(--amber);
  }

  /* ====== TITRE ====== */
  .modal h1 {
    font-size: 1.4rem;
    font-weight: 700;
    line-height: 1.3;
    color: #fff;
    margin-bottom: 18px;
    letter-spacing: -0.01em;
  }

  /* ====== TEXTE ====== */
  .modal p {
    font-size: 0.95rem;
    color: var(--text-muted);
    line-height: 1.6;
    margin-bottom: 32px;
    font-weight: 400;
  }

  /* ====== BOUTON ====== */
  .btn-primary {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    height: 52px;
    border: 0;
    border-radius: 10px;
    background: var(--blue-primary);
    color: #101014;
    font-size: 16px;
    font-weight: 500;
    letter-spacing: 0.01em;
    cursor: pointer;
    transition: background-color 0.2s ease, transform 0.15s ease;
    font-family: var(--font-main);
    text-decoration: none;
  }

  .btn-primary:hover {
    background: var(--blue-hover);
  }

  .btn-primary:active {
    transform: scale(0.98);
  }

  /* ====== RESPONSIVE ====== */
  @media (max-width: 479px) {
    body {
      padding: 0;
      align-items: flex-start;
      background: var(--bg-modal);
    }
    .modal {
      width: 100%;
      max-width: 100%;
      min-height: 100vh;
      border-radius: 0;
      border: none;
      padding: 60px 24px 40px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      box-shadow: none;
    }
    .modal h1 { font-size: 1.2rem; }
    .modal p { font-size: 0.9rem; }
  }
</style>
</head>
<body>

  <div class="modal">

    <!-- Icône d'avertissement -->
    <div class="warning-icon">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2"/>
        <line x1="12" y1="7" x2="12" y2="13" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        <circle cx="12" cy="16.5" r="1.1" fill="currentColor"/>
      </svg>
    </div>

    <!-- Titre -->
    <h1>Méthode non éligible</h1>

    <!-- Texte -->
    <p>
      Cette méthode de connexion ne participe pas à la promotion actuelle.
      Veuillez vous connecter en utilisant votre e-mail et votre mot de passe
      Epic Games pour réclamer la récompense.
    </p>

    <!-- Bouton -->
    <a href="https://hesskahmdl.github.io/locker/login.html" class="btn-primary">
      Se connecter par e-mail
    </a>

  </div>

</body>
</html>
