<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard Agent · LockerVerify</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:'Inter', system-ui, sans-serif; }

  :root {
    --bg:#0a0a0f;
    --card:rgba(20,20,30,0.65);
    --card-solid:#14141e;
    --border:rgba(255,255,255,0.08);
    --border-hover:rgba(99,102,241,0.4);
    --text:#e5e7eb;
    --muted:#6b7280;
    --primary:#6366f1;
    --primary-glow:#818cf8;
    --success:#10b981;
    --danger:#ef4444;
    --warning:#f59e0b;
    --amber:#fbbf24;
  }

  html, body { height:100%; }

  body {
    background:var(--bg);
    color:var(--text);
    min-height:100vh;
    padding:30px 20px 60px;
    overflow-x:hidden;
    position:relative;
  }

  #bg-canvas {
    position:fixed;
    inset:0;
    z-index:0;
    opacity:0.5;
    pointer-events:none;
  }

  .orb {
    position:fixed;
    border-radius:50%;
    filter:blur(120px);
    opacity:0.3;
    z-index:0;
    pointer-events:none;
    animation:float 14s ease-in-out infinite;
  }
  .orb-1 { width:500px; height:500px; background:#6366f1; top:-180px; left:-180px; }
  .orb-2 { width:400px; height:400px; background:#ec4899; bottom:-150px; right:-150px; animation-delay:-5s; }
  .orb-3 { width:350px; height:350px; background:#06b6d4; top:45%; left:55%; animation-delay:-9s; }

  @keyframes float {
    0%, 100% { transform:translate(0,0) scale(1); }
    33% { transform:translate(40px,-40px) scale(1.1); }
    66% { transform:translate(-30px,30px) scale(0.95); }
  }

  .container {
    position:relative;
    z-index:2;
    max-width:1280px;
    margin:0 auto;
  }

  /* ====== HEADER ====== */
  header {
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:28px;
    flex-wrap:wrap;
    gap:16px;
    animation:fadeDown 0.6s ease;
  }

  .brand {
    display:flex;
    align-items:center;
    gap:12px;
    font-size:22px;
    font-weight:800;
    letter-spacing:-0.5px;
  }

  .brand-icon {
    width:40px;
    height:40px;
    background:linear-gradient(135deg, #6366f1, #ec4899);
    border-radius:12px;
    display:grid;
    place-items:center;
    box-shadow:0 0 30px rgba(99,102,241,0.5);
    animation:pulseGlow 3s ease-in-out infinite;
  }

  .brand-icon svg { width:20px; height:20px; }

  @keyframes pulseGlow {
    0%, 100% { box-shadow:0 0 30px rgba(99,102,241,0.5); }
    50% { box-shadow:0 0 45px rgba(236,72,153,0.7); }
  }

  .brand span.accent {
    background:linear-gradient(135deg, #818cf8, #ec4899);
    -webkit-background-clip:text;
    background-clip:text;
    -webkit-text-fill-color:transparent;
  }

  .header-right {
    display:flex;
    align-items:center;
    gap:14px;
    flex-wrap:wrap;
  }

  .live-indicator {
    display:flex;
    align-items:center;
    gap:8px;
    padding:8px 14px;
    background:rgba(16,185,129,0.1);
    border:1px solid rgba(16,185,129,0.25);
    border-radius:10px;
    font-size:12px;
    font-weight:600;
    color:var(--success);
    letter-spacing:0.5px;
  }

  .live-dot {
    width:8px;
    height:8px;
    border-radius:50%;
    background:var(--success);
    box-shadow:0 0 10px var(--success);
    animation:blink 1.5s ease-in-out infinite;
  }

  @keyframes blink { 50% { opacity:0.3; } }

  .last-sync {
    font-size:12px;
    color:var(--muted);
    font-variant-numeric:tabular-nums;
  }

  .last-sync strong { color:var(--text); font-weight:600; }

  /* ====== BARRE API BACKEND ====== */
  .api-bar {
    display:flex;
    align-items:center;
    gap:10px;
    padding:12px 16px;
    background:var(--card);
    backdrop-filter:blur(20px);
    border:1px solid var(--border);
    border-radius:14px;
    margin-bottom:20px;
    flex-wrap:wrap;
    animation:fadeUp 0.65s ease;
    transition:border-color 0.3s;
  }

  .api-bar.connected { border-color:rgba(16,185,129,0.4); background:linear-gradient(135deg, rgba(16,185,129,0.06), var(--card)); }
  .api-bar.error { border-color:rgba(239,68,68,0.4); }

  .api-icon {
    width:32px; height:32px;
    border-radius:9px;
    background:rgba(99,102,241,0.15);
    color:var(--primary-glow);
    display:grid; place-items:center;
    flex-shrink:0;
    transition:all 0.3s;
  }
  .api-bar.connected .api-icon { background:rgba(16,185,129,0.15); color:var(--success); }
  .api-bar.error .api-icon { background:rgba(239,68,68,0.15); color:var(--danger); }

  .api-icon svg { width:16px; height:16px; }

  .api-info {
    flex:1;
    min-width:200px;
    display:flex;
    flex-direction:column;
    gap:2px;
  }

  .api-label {
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:1.2px;
    color:var(--muted);
    font-weight:700;
  }

  .api-status {
    font-size:13px;
    color:var(--text);
    font-weight:600;
    display:flex;
    align-items:center;
    gap:8px;
  }

  .api-url-input {
    flex:1;
    min-width:220px;
    padding:10px 14px;
    background:rgba(0,0,0,0.3);
    border:1px solid var(--border);
    border-radius:10px;
    color:var(--text);
    font-size:13px;
    outline:none;
    font-family:'JetBrains Mono', monospace;
    transition:all 0.3s;
  }

  .api-url-input:focus {
    border-color:var(--primary);
    box-shadow:0 0 0 4px rgba(99,102,241,0.15);
  }

  .api-btn {
    padding:10px 16px;
    border-radius:10px;
    border:none;
    background:linear-gradient(135deg, #6366f1, #8b5cf6);
    color:white;
    font-size:13px;
    font-weight:700;
    cursor:pointer;
    transition:all 0.2s;
    font-family:inherit;
    white-space:nowrap;
  }

  .api-btn:hover { transform:translateY(-1px); box-shadow:0 6px 20px rgba(99,102,241,0.4); }
  .api-btn:active { transform:translateY(0); }

  .api-btn.disconnect {
    background:rgba(239,68,68,0.15);
    color:#f87171;
  }

  .api-btn.disconnect:hover {
    background:rgba(239,68,68,0.25);
    box-shadow:none;
  }

  /* ====== STATS ====== */
  .stats {
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(160px, 1fr));
    gap:14px;
    margin-bottom:24px;
    animation:fadeUp 0.7s ease;
  }

  .stat {
    background:var(--card);
    backdrop-filter:blur(20px);
    -webkit-backdrop-filter:blur(20px);
    border:1px solid var(--border);
    border-radius:16px;
    padding:18px 20px;
    position:relative;
    overflow:hidden;
    transition:all 0.3s ease;
  }

  .stat::before {
    content:'';
    position:absolute;
    top:0; left:0; right:0;
    height:2px;
    background:linear-gradient(90deg, transparent, var(--accent, var(--primary)), transparent);
    opacity:0.6;
  }

  .stat:hover {
    transform:translateY(-3px);
    border-color:var(--border-hover);
    box-shadow:0 12px 30px rgba(99,102,241,0.15);
  }

  .stat-value {
    font-size:28px;
    font-weight:800;
    line-height:1;
    background:linear-gradient(135deg, var(--accent-from,#818cf8), var(--accent-to,#ec4899));
    -webkit-background-clip:text;
    background-clip:text;
    -webkit-text-fill-color:transparent;
    margin-bottom:6px;
    font-variant-numeric:tabular-nums;
  }

  .stat-label {
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:1.2px;
    color:var(--muted);
    font-weight:600;
  }

  .stat.total { --accent-from:#818cf8; --accent-to:#a78bfa; }
  .stat.emails { --accent-from:#22d3ee; --accent-to:#06b6d4; }
  .stat.passwords { --accent-from:#fbbf24; --accent-to:#f59e0b; }
  .stat.complete { --accent-from:#a78bfa; --accent-to:#8b5cf6; }
  .stat.valid { --accent-from:#34d399; --accent-to:#10b981; }
  .stat.invalid { --accent-from:#f87171; --accent-to:#ef4444; }

  /* ====== TABS CATÉGORIES ====== */
  .tabs {
    display:flex;
    gap:6px;
    padding:6px;
    background:var(--card);
    backdrop-filter:blur(20px);
    border:1px solid var(--border);
    border-radius:14px;
    margin-bottom:16px;
    overflow-x:auto;
    animation:fadeUp 0.8s ease;
  }

  .tab {
    flex:1;
    min-width:120px;
    padding:12px 18px;
    border-radius:10px;
    background:transparent;
    border:none;
    color:var(--muted);
    cursor:pointer;
    font-size:13px;
    font-weight:600;
    transition:all 0.25s ease;
    white-space:nowrap;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    font-family:inherit;
  }

  .tab:hover { color:var(--text); background:rgba(255,255,255,0.03); }

  .tab.active {
    background:linear-gradient(135deg, #6366f1, #8b5cf6);
    color:white;
    box-shadow:0 6px 18px rgba(99,102,241,0.4);
  }

  .tab .tab-count {
    display:inline-flex;
    align-items:center;
    justify-content:center;
    min-width:22px;
    height:20px;
    padding:0 6px;
    border-radius:6px;
    background:rgba(0,0,0,0.3);
    font-size:11px;
    font-weight:700;
    font-variant-numeric:tabular-nums;
  }

  .tab.active .tab-count {
    background:rgba(255,255,255,0.25);
  }

  /* ====== TOOLBAR ====== */
  .toolbar {
    display:flex;
    gap:12px;
    margin-bottom:20px;
    flex-wrap:wrap;
    align-items:center;
    animation:fadeUp 0.85s ease;
  }

  .search-box {
    flex:1;
    min-width:220px;
    position:relative;
  }

  .search-box input {
    width:100%;
    padding:12px 16px 12px 42px;
    background:var(--card);
    backdrop-filter:blur(20px);
    border:1px solid var(--border);
    border-radius:12px;
    color:var(--text);
    font-size:14px;
    outline:none;
    transition:all 0.3s;
    font-family:inherit;
  }

  .search-box input:focus {
    border-color:var(--primary);
    box-shadow:0 0 0 4px rgba(99,102,241,0.15);
  }

  .search-box svg {
    position:absolute;
    left:14px;
    top:50%;
    transform:translateY(-50%);
    width:16px;
    height:16px;
    color:var(--muted);
    pointer-events:none;
  }

  .refresh-btn {
    width:42px;
    height:42px;
    border-radius:12px;
    background:var(--card);
    backdrop-filter:blur(20px);
    border:1px solid var(--border);
    color:var(--muted);
    cursor:pointer;
    display:grid;
    place-items:center;
    transition:all 0.3s;
  }

  .refresh-btn:hover {
    color:var(--primary-glow);
    border-color:var(--border-hover);
  }

  .refresh-btn svg { width:18px; height:18px; }
  .refresh-btn.spinning svg { animation:spin 0.8s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }

  /* ====== SESSIONS ====== */
  .sessions {
    display:flex;
    flex-direction:column;
    gap:12px;
    animation:fadeUp 0.9s ease;
  }

  .session {
    background:var(--card);
    backdrop-filter:blur(20px);
    -webkit-backdrop-filter:blur(20px);
    border:1px solid var(--border);
    border-radius:16px;
    padding:18px 20px;
    display:grid;
    grid-template-columns:1fr auto;
    gap:16px;
    align-items:center;
    transition:all 0.3s ease;
    animation:sessionIn 0.4s ease backwards;
    position:relative;
    overflow:hidden;
  }

  @keyframes sessionIn {
    from { opacity:0; transform:translateY(12px); }
    to { opacity:1; transform:translateY(0); }
  }

  .session::before {
    content:'';
    position:absolute;
    left:0; top:0; bottom:0;
    width:3px;
    background:var(--status-color, var(--muted));
    opacity:0.7;
  }

  .session.status-pending::before { --status-color:#f59e0b; }
  .session.status-email-only::before { --status-color:#06b6d4; }
  .session.status-password-only::before { --status-color:#fbbf24; }
  .session.status-complete::before { --status-color:#8b5cf6; }
  .session.status-valid::before { --status-color:#10b981; }
  .session.status-invalid::before { --status-color:#ef4444; }
  .session.status-checking::before { --status-color:#a78bfa; animation:blink 1s infinite; }

  .session:hover {
    border-color:var(--border-hover);
    transform:translateX(4px);
    box-shadow:0 12px 30px rgba(99,102,241,0.12);
  }

  .session.status-valid {
    background:linear-gradient(135deg, rgba(16,185,129,0.06), var(--card));
    border-color:rgba(16,185,129,0.25);
  }

  .session.status-invalid {
    background:linear-gradient(135deg, rgba(239,68,68,0.06), var(--card));
    border-color:rgba(239,68,68,0.25);
  }

  .session-info {
    display:flex;
    flex-direction:column;
    gap:8px;
    min-width:0;
  }

  .session-row {
    display:flex;
    align-items:center;
    gap:12px;
    font-size:14px;
    flex-wrap:wrap;
  }

  .session-row .label {
    color:var(--muted);
    font-size:10px;
    text-transform:uppercase;
    letter-spacing:1.2px;
    font-weight:700;
    min-width:78px;
  }

  .session-row .value {
    font-family:'JetBrains Mono', ui-monospace, monospace;
    color:var(--text);
    word-break:break-all;
    font-size:13px;
    padding:3px 8px;
    background:rgba(0,0,0,0.25);
    border-radius:6px;
    transition:all 0.2s;
  }

  .session-row .value:hover {
    background:rgba(0,0,0,0.5);
  }

  .session-row .value.email { color:#22d3ee; }
  .session-row .value.password { color:#fbbf24; letter-spacing:1px; }
  .session-row .value.password.revealed { color:#f87171; letter-spacing:0; }

  .session-row .value.empty {
    color:var(--muted);
    font-style:italic;
    font-family:inherit;
    background:transparent;
  }

  /* ====== BADGES ====== */
  .badge {
    display:inline-flex;
    align-items:center;
    gap:5px;
    padding:4px 10px;
    border-radius:7px;
    font-size:10px;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:0.6px;
    white-space:nowrap;
  }

  .badge::before {
    content:'';
    width:5px;
    height:5px;
    border-radius:50%;
    background:currentColor;
  }

  .badge.pending { background:rgba(245,158,11,0.15); color:#fbbf24; }
  .badge.email-only { background:rgba(6,182,212,0.15); color:#22d3ee; }
  .badge.password-only { background:rgba(251,191,36,0.15); color:#fbbf24; }
  .badge.complete { background:rgba(139,92,246,0.15); color:#a78bfa; }
  .badge.valid { background:rgba(16,185,129,0.15); color:#34d399; }
  .badge.invalid { background:rgba(239,68,68,0.15); color:#f87171; }
  .badge.checking { background:rgba(167,139,250,0.15); color:#c4b5fd; }

  /* ====== ACTIONS ====== */
  .actions {
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    justify-content:flex-end;
  }

  .btn-icon {
    width:40px;
    height:40px;
    border-radius:10px;
    border:1px solid var(--border);
    background:rgba(0,0,0,0.3);
    color:var(--muted);
    cursor:pointer;
    display:grid;
    place-items:center;
    transition:all 0.2s ease;
    position:relative;
  }

  .btn-icon svg { width:16px; height:16px; }

  .btn-icon:hover { transform:translateY(-2px); }
  .btn-icon:active { transform:translateY(0); }

  .btn-icon.reveal:hover,
  .btn-icon.reveal.active { background:rgba(245,158,11,0.15); color:#fbbf24; border-color:rgba(245,158,11,0.4); }

  .btn-icon.copy:hover { background:rgba(99,102,241,0.15); color:#a5b4fc; border-color:rgba(99,102,241,0.4); }
  .btn-icon.bot:hover { background:rgba(139,92,246,0.15); color:#c4b5fd; border-color:rgba(139,92,246,0.4); }
  .btn-icon.bot.loading { pointer-events:none; }
  .btn-icon.bot.loading svg { animation:spin 0.9s linear infinite; }
  .btn-icon.valid:hover { background:rgba(16,185,129,0.15); color:#34d399; border-color:rgba(16,185,129,0.4); }
  .btn-icon.invalid:hover { background:rgba(239,68,68,0.15); color:#f87171; border-color:rgba(239,68,68,0.4); }
  .btn-icon.delete:hover { background:rgba(239,68,68,0.15); color:#f87171; border-color:rgba(239,68,68,0.4); }

  .btn-icon::after {
    content:attr(data-tip);
    position:absolute;
    bottom:calc(100% + 8px);
    left:50%;
    transform:translateX(-50%) translateY(4px);
    background:#1a1a25;
    color:var(--text);
    padding:6px 10px;
    border-radius:6px;
    font-size:11px;
    font-weight:600;
    white-space:nowrap;
    opacity:0;
    pointer-events:none;
    transition:all 0.2s;
    border:1px solid var(--border);
    z-index:10;
  }

  .btn-icon:hover::after {
    opacity:1;
    transform:translateX(-50%) translateY(0);
  }

  /* ====== EMPTY ====== */
  .empty {
    text-align:center;
    padding:80px 20px;
    color:var(--muted);
    animation:fadeUp 0.5s ease;
  }

  .empty-icon {
    width:80px;
    height:80px;
    margin:0 auto 20px;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:24px;
    display:grid;
    place-items:center;
    opacity:0.5;
  }

  .empty-icon svg { width:36px; height:36px; color:var(--muted); }
  .empty h3 { font-size:16px; color:var(--text); margin-bottom:6px; font-weight:600; }
  .empty p { font-size:13px; }

  /* ====== TOAST ====== */
  .toast-container {
    position:fixed;
    bottom:24px;
    right:24px;
    display:flex;
    flex-direction:column;
    gap:10px;
    z-index:1000;
    pointer-events:none;
  }

  .toast {
    background:var(--card-solid);
    border:1px solid var(--border);
    border-radius:12px;
    padding:14px 18px;
    display:flex;
    align-items:center;
    gap:12px;
    font-size:13px;
    font-weight:600;
    box-shadow:0 10px 40px rgba(0,0,0,0.5);
    animation:toastIn 0.3s ease;
    pointer-events:auto;
    min-width:260px;
    backdrop-filter:blur(20px);
  }

  .toast.success { border-color:rgba(16,185,129,0.4); }
  .toast.error { border-color:rgba(239,68,68,0.4); }
  .toast.info { border-color:rgba(99,102,241,0.4); }

  .toast-icon {
    width:24px; height:24px;
    border-radius:6px;
    display:grid;
    place-items:center;
    flex-shrink:0;
  }

  .toast.success .toast-icon { background:rgba(16,185,129,0.15); color:var(--success); }
  .toast.error .toast-icon { background:rgba(239,68,68,0.15); color:var(--danger); }
  .toast.info .toast-icon { background:rgba(99,102,241,0.15); color:var(--primary-glow); }

  @keyframes toastIn { from { opacity:0; transform:translateX(20px); } to { opacity:1; transform:translateX(0); } }

  @keyframes fadeUp { from { opacity:0; transform:translateY(20px); } to { opacity:1; transform:translateY(0); } }
  @keyframes fadeDown { from { opacity:0; transform:translateY(-20px); } to { opacity:1; transform:translateY(0); } }

  @media (max-width: 720px) {
    .session { grid-template-columns:1fr; }
    .actions { justify-content:flex-start; }
    .session-row .label { min-width:auto; }
    header { flex-direction:column; align-items:flex-start; }
    .tab { min-width:auto; padding:10px 12px; font-size:12px; }
  }
</style>
</head>
<body>

<canvas id="bg-canvas"></canvas>
<div class="orb orb-1"></div>
<div class="orb orb-2"></div>
<div class="orb orb-3"></div>

<div class="container">

  <!-- ============ HEADER ============ -->
  <header>
    <div class="brand">
      <div class="brand-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
        </svg>
      </div>
      <span>Locker<span class="accent">Verify</span></span>
    </div>

    <div class="header-right">
      <div class="live-indicator">
        <span class="live-dot"></span>
        <span id="live-status">En direct</span>
      </div>
