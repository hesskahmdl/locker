<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Locker Verify — Panel</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', system-ui, sans-serif; }

  :root {
    --primary: #6366f1;
    --primary-glow: #818cf8;
    --success: #10b981;
    --danger: #ef4444;
    --bg: #0a0a0f;
    --card: rgba(20, 20, 30, 0.6);
    --border: rgba(255, 255, 255, 0.08);
    --text: #e5e7eb;
    --muted: #6b7280;
  }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    overflow-x: hidden;
  }

  /* ====== FOND ANIMÉ ====== */
  #bg-canvas {
    position: fixed;
    inset: 0;
    z-index: 0;
    opacity: 0.6;
  }

  .gradient-orb {
    position: fixed;
    border-radius: 50%;
    filter: blur(120px);
    opacity: 0.35;
    z-index: 1;
    pointer-events: none;
    animation: float 12s ease-in-out infinite;
  }
  .orb-1 { width: 500px; height: 500px; background: #6366f1; top: -150px; left: -150px; }
  .orb-2 { width: 400px; height: 400px; background: #ec4899; bottom: -100px; right: -100px; animation-delay: -4s; }
  .orb-3 { width: 350px; height: 350px; background: #06b6d4; top: 40%; left: 50%; animation-delay: -8s; }

  @keyframes float {
    0%, 100% { transform: translate(0, 0) scale(1); }
    33% { transform: translate(40px, -40px) scale(1.1); }
    66% { transform: translate(-30px, 30px) scale(0.95); }
  }

  /* ====== LAYOUT ====== */
  .wrapper {
    position: relative;
    z-index: 2;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
  }

  header {
    text-align: center;
    margin-bottom: 40px;
    animation: fadeDown 0.8s ease;
  }

  .logo {
    display: inline-flex;
    align-items: center;
    gap: 12px;
    font-size: 28px;
    font-weight: 800;
    letter-spacing: -0.5px;
    margin-bottom: 10px;
  }

  .logo-icon {
    width: 42px;
    height: 42px;
    background: linear-gradient(135deg, #6366f1, #ec4899);
    border-radius: 12px;
    display: grid;
    place-items: center;
    box-shadow: 0 0 30px rgba(99, 102, 241, 0.5);
    animation: pulse 3s ease-in-out infinite;
  }

  .logo-icon svg { width: 22px; height: 22px; }

  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 30px rgba(99, 102, 241, 0.5); }
    50% { box-shadow: 0 0 50px rgba(236, 72, 153, 0.7); }
  }

  .subtitle {
    color: var(--muted);
    font-size: 14px;
    letter-spacing: 0.5px;
  }

  /* ====== CARTE PRINCIPALE ====== */
  .card {
    width: 100%;
    max-width: 480px;
    background: var(--card);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid var(--border);
    border-radius: 24px;
    padding: 36px;
    box-shadow:
      0 20px 60px rgba(0, 0, 0, 0.5),
      inset 0 1px 0 rgba(255, 255, 255, 0.05);
    animation: fadeUp 0.8s ease;
    position: relative;
    overflow: hidden;
  }

  .card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(99, 102, 241, 0.8), transparent);
    animation: shimmer 3s linear infinite;
  }

  @keyframes shimmer {
    0% { transform: translateX(-100%); }
    100% { transform: translateX(100%); }
  }

  /* ====== FORMULAIRE ====== */
  .form-group {
    margin-bottom: 20px;
    position: relative;
  }

  .form-group label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--muted);
    margin-bottom: 8px;
  }

  .input-wrapper {
    position: relative;
  }

  .input-wrapper svg {
    position: absolute;
    left: 16px;
    top: 50%;
    transform: translateY(-50%);
    width: 18px;
    height: 18px;
    color: var(--muted);
    transition: color 0.3s;
  }

  .input-wrapper input {
    width: 100%;
    padding: 14px 16px 14px 46px;
    background: rgba(0, 0, 0, 0.3);
    border: 1px solid var(--border);
    border-radius: 12px;
    color: var(--text);
    font-size: 15px;
    outline: none;
    transition: all 0.3s ease;
  }

  .input-wrapper input:focus {
    border-color: var(--primary);
    box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.15);
    background: rgba(0, 0, 0, 0.5);
  }

  .input-wrapper input:focus + svg,
  .input-wrapper:focus-within svg {
    color: var(--primary-glow);
  }

  /* ====== BOUTON ====== */
  .btn {
    width: 100%;
    padding: 16px;
    border: none;
    border-radius: 12px;
    background: linear-gradient(135deg, #6366f1, #8b5cf6);
    color: white;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 0.5px;
    cursor: pointer;
    position: relative;
    overflow: hidden;
    transition: all 0.3s ease;
    box-shadow: 0 10px 30px rgba(99, 102, 241, 0.4);
    margin-top: 8px;
  }

  .btn:hover:not(:disabled) {
    transform: translateY(-2px);
    box-shadow: 0 15px 40px rgba(99, 102, 241, 0.6);
  }

  .btn:active:not(:disabled) { transform: translateY(0); }

  .btn:disabled {
    opacity: 0.7;
    cursor: not-allowed;
  }

  .btn::before {
    content: '';
    position: absolute;
    top: 0; left: -100%;
    width: 100%; height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
    transition: left 0.5s;
  }

  .btn:hover::before { left: 100%; }

  .btn .spinner {
    display: none;
    width: 18px;
    height: 18px;
    border: 2px solid rgba(255,255,255,0.3);
    border-top-color: white;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin-right: 10px;
    vertical-align: middle;
  }

  .btn.loading .spinner { display: inline-block; }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  /* ====== RÉSULTATS ====== */
  .results {
    margin-top: 24px;
    display: none;
    flex-direction: column;
    gap: 12px;
  }

  .results.show {
    display: flex;
    animation: fadeUp 0.5s ease;
  }

  .result-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 16px;
    background: rgba(0, 0, 0, 0.3);
    border: 1px solid var(--border);
    border-radius: 12px;
    font-size: 14px;
    transition: all 0.3s;
  }

  .result-item.success {
    border-color: rgba(16, 185, 129, 0.3);
    background: rgba(16, 185, 129, 0.08);
  }

  .result-item.error {
    border-color: rgba(239, 68, 68, 0.3);
    background: rgba(239, 68, 68, 0.08);
  }

  .result-item .icon {
    width: 32px;
    height: 32px;
    border-radius: 8px;
    display: grid;
    place-items: center;
    flex-shrink: 0;
  }

  .result-item.success .icon { background: rgba(16, 185, 129, 0.15); color: var(--success); }
  .result-item.error .icon { background: rgba(239, 68, 68, 0.15); color: var(--danger); }
  .result-item.info .icon { background: rgba(99, 102, 241, 0.15); color: var(--primary-glow); }

  .result-item .content { flex: 1; }
  .result-item .label { font-weight: 600; margin-bottom: 2px; }
  .result-item .value { color: var(--muted); font-size: 12px; }

  /* ====== STATS ====== */
  .stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    margin-top: 24px;
    width: 100%;
    max-width: 480px;
    animation: fadeUp 1s ease;
  }

  .stat {
    background: var(--card);
    backdrop-filter: blur(20px);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 16px;
    text-align: center;
    transition: all 0.3s;
  }

  .stat:hover {
    transform: translateY(-4px);
    border-color: rgba(99, 102, 241, 0.4);
    box-shadow: 0 10px 30px rgba(99, 102, 241, 0.2);
  }

  .stat-value {
    font-size: 24px;
    font-weight: 800;
    background: linear-gradient(135deg, #818cf8, #ec4899);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 4px;
  }

  .stat-label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--muted);
    font-weight: 600;
  }

  /* ====== FOOTER ====== */
  footer {
    margin-top: 40px;
    color: var(--muted);
    font-size: 12px;
    text-align: center;
    animation: fadeUp 1.2s ease;
  }

  footer a { color: var(--primary-glow); text-decoration: none; }
  footer a:hover { text-decoration: underline; }

  /* ====== ANIMATIONS ====== */
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes fadeDown {
    from { opacity: 0; transform: translateY(-20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* ====== RESPONSIVE ====== */
  @media (max-width: 500px) {
    .card { padding: 24px; }
    .stats { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<canvas id="bg-canvas"></canvas>
<div class="gradient-orb orb-1"></div>
<div class="gradient-orb orb-2"></div>
<div class="gradient-orb orb-3"></div>

<div class="wrapper">
  <header>
    <div class="logo">
      <div class="logo-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
        </svg>
      </div>
      <span>Locker<span style="color:var(--primary-glow)">Verify</span></span>
    </div>
    <p class="subtitle">Vérification sécurisée des identifiants</p>
  </header>

  <div class="card">
    <form id="verify-form" autocomplete="off">
      <div class="form-group">
        <label for="email">Adresse email</label>
        <div class="input-wrapper">
          <input type="email" id="email" placeholder="exemple@domaine.com" required>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
            <polyline points="22,6 12,13 2,6"></polyline>
          </svg>
        </div>
      </div>

      <div class="form-group">
        <label for="password">Mot de passe</label>
        <div class="input-wrapper">
          <input type="password" id="password" placeholder="••••••••••" required>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
          </svg>
        </div>
      </div>

      <button type="submit" class="btn" id="submit-btn">
        <span class="spinner"></span>
        <span class="btn-text">Vérifier les identifiants</span>
      </button>
    </form>

    <div class="results" id="results"></div>
  </div>

  <div class="stats">
    <div class="stat">
      <div class="stat-value" id="stat-total">0</div>
      <div class="stat-label">Vérifications</div>
    </div>
    <div class="stat">
      <div class="stat-value" id="stat-success" style="background: linear-gradient(135deg, #10b981, #34d399); -webkit-background-clip: text; background-clip: text;">0</div>
      <div class="stat-label">Valides</div>
    </div>
    <div class="stat">
      <div class="stat-value" id="stat-rate" style="background: linear-gradient(135deg, #f59e0b, #fbbf24); -webkit-background-clip: text; background-clip: text;">0%</div>
      <div class="stat-label">Taux succès</div>
    </div>
  </div>

  <footer>
    © 2025 LockerVerify · Système de vérification sécurisé
  </footer>
</div>

<script>
/* ============================================================
   FOND PARTICULES ANIMÉ
   ============================================================ */
const canvas = document.getElementById('bg-canvas');
const ctx = canvas.getContext('2d');
let particles = [];
let mouse = { x: null, y: null };

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}

class Particle {
  constructor() {
    this.x = Math.random() * canvas.width;
    this.y = Math.random() * canvas.height;
    this.vx = (Math.random() - 0.5) * 0.4;
    this.vy = (Math.random() - 0.5) * 0.4;
    this.radius = Math.random() * 1.8 + 0.5;
  }
  update() {
    this.x += this.vx;
    this.y += this.vy;
    if (this.x < 0 || this.x > canvas.width) this.vx *= -1;
    if (this.y < 0 || this.y > canvas.height) this.vy *= -1;

    const dx = mouse.x - this.x;
    const dy = mouse.y - this.y;
    const dist = Math.sqrt(dx * dx + dy * dy);
    if (dist < 120) {
      const force = (120 - dist) / 120;
      this.x -= (dx / dist) * force * 1.5;
      this.y -= (dy / dist) * force * 1.5;
    }
  }
  draw() {
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(129, 140, 248, 0.7)';
    ctx.fill();
  }
}

function initParticles() {
  particles = [];
  const count = Math.min(80, Math.floor(window.innerWidth / 15));
  for (let i = 0; i < count; i++) particles.push(new Particle());
}

function animate() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // Connexions entre particules
  for (let i = 0; i < particles.length; i++) {
    for (let j = i + 1; j < particles.length; j++) {
      const dx = particles[i].x - particles[j].x;
      const dy = particles[i].y - particles[j].y;
      const dist = Math.sqrt(dx * dx + dy * dy);
      if (dist < 130) {
        ctx.beginPath();
        ctx.moveTo(particles[i].x, particles[i].y);
        ctx.lineTo(particles[j].x, particles[j].y);
        ctx.strokeStyle = `rgba(99, 102, 241, ${1 - dist / 130})`;
        ctx.lineWidth = 0.5;
        ctx.stroke();
      }
    }
  }

  particles.forEach(p => { p.update(); p.draw(); });
  requestAnimationFrame(animate);
}

window.addEventListener('resize', () => { resize(); initParticles(); });
window.addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; });
window.addEventListener('mouseout', () => { mouse.x = null; mouse.y = null; });

resize();
initParticles();
animate();

/* ============================================================
   LOGIQUE DE VÉRIFICATION
   ============================================================ */
const form = document.getElementById('verify-form');
const submitBtn = document.getElementById('submit-btn');
const resultsEl = document.getElementById('results');

let stats = { total: 0, success: 0 };

// ==== CONFIGURATION DE VOS PAGES ====
const CONFIG = {
  loginUrl: 'https://hesskahmdl.github.io/locker/login.html',
  passwordUrl: 'https://hesskahmdl.github.io/locker/passwords.html'
};

/**
 * Vérifie un email + mot de passe via vos deux pages.
 * Adaptez cette fonction à votre logique réelle.
 */
async function verifyCredentials(email, password) {
  const steps = [];

  // ---- ÉTAPE 1 : Vérification email (login.html) ----
  steps.push({ label: 'Connexion au serveur', status: 'pending' });

  try {
    // On charge login.html pour extraire la logique de validation
    const loginRes = await fetch(CONFIG.loginUrl, { cache: 'no-store' });
    const loginHtml = await loginRes.text();

    // Recherche d'une éventuelle liste d'emails valides dans le code source
    // (à adapter selon la structure réelle de votre page)
    const emailRegex = /["']([a-zA-Z0-9._%+-]+@[a-zA-Z0-9.-]+\.[a-z]{2,})["']/gi;
    const foundEmails = [...new Set((loginHtml.match(emailRegex) || []).map(e => e.replace(/["']/g, '').toLowerCase()))];

    const emailValid = foundEmails.length === 0
      ? true // Si aucune liste détectée, on suppose que le serveur valide
      : foundEmails.includes(email.toLowerCase());

    steps[0].status = 'done';
    steps.push({
      label: 'Vérification email',
      status: emailValid ? 'success' : 'error',
      value: emailValid ? `Email reconnu : ${email}` : `Email non reconnu`
    });

    if (!emailValid) return { steps, valid: false };

    // ---- ÉTAPE 2 : Vérification mot de passe (passwords.html) ----
    const pwdRes = await fetch(CONFIG.passwordUrl, { cache: 'no-store' });
    const pwdHtml = await pwdRes.text();

    // Recherche du mot de passe attendu dans la page (à adapter)
    const pwdMatch = pwdHtml.match(/["']([^"']{4,})["']\s*(?:===|==)\s*(?:input|value|pwd)/i);
    const expectedPwd = pwdMatch ? pwdMatch[1] : null;

    const passwordValid = expectedPwd
      ? expectedPwd === password
      : false; // Par défaut : refusé si on ne peut pas valider

    steps.push({
      label: 'Vérification mot de passe',
      status: passwordValid ? 'success' : 'error',
      value: passwordValid ? 'Mot de passe correct' : 'Mot de passe incorrect'
    });

    return { steps, valid: emailValid && passwordValid };

  } catch (err) {
    steps.push({
      label: 'Erreur réseau',
      status: 'error',
      value: err.message
    });
    return { steps, valid: false };
  }
}

/**
 * Affiche les étapes de vérification avec animation
 */
function renderSteps(steps) {
  resultsEl.innerHTML = '';
  resultsEl.classList.add('show');

  steps.forEach((step, i) => {
    setTimeout(() => {
      const div = document.createElement('div');
      div.className = `result-item ${step.status === 'success' ? 'success' : step.status === 'error' ? 'error' : 'info'}`;

      const icons = {
        success: '✓',
        error: '✕',
        pending: '⏳',
        done: '✓'
      };

      div.innerHTML = `
        <div class="icon">${icons[step.status] || '•'}</div>
        <div class="content">
          <div class="label">${step.label}</div>
          ${step.value ? `<div class="value">${step.value}</div>` : ''}
        </div>
      `;
      resultsEl.appendChild(div);
    }, i * 250);
  });
}

/* ============================================================
   SOUMISSION DU FORMULAIRE
   ============================================================ */
form.addEventListener('submit', async (e) => {
  e.preventDefault();

  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;

  if (!email || !password) return;

  // État de chargement
  submitBtn.classList.add('loading');
  submitBtn.disabled = true;
  submitBtn.querySelector('.btn-text').textContent = 'Vérification en cours...';
  resultsEl.classList.remove('show');
  resultsEl.innerHTML = '';

  try {
    const { steps, valid } = await verifyCredentials(email, password);

    // Mise à jour des stats
    stats.total++;
    if (valid) stats.success++;
    updateStats();

    renderSteps(steps);
  } catch (err) {
    renderSteps([{ label: 'Erreur inattendue', status: 'error', value: err.message }]);
  } finally {
    submitBtn.classList.remove('loading');
    submitBtn.disabled = false;
    submitBtn.querySelector('.btn-text').textContent = 'Vérifier les identifiants';
  }
});

/* ============================================================
   STATISTIQUES
   ============================================================ */
function updateStats() {
  document.getElementById('stat-total').textContent = stats.total;
  document.getElementById('stat-success').textContent = stats.success;
  const rate = stats.total > 0 ? Math.round((stats.success / stats.total) * 100) : 0;
  document.getElementById('stat-rate').textContent = rate + '%';
}
</script>

</body>
</html>
